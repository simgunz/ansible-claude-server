---
# User to install Claude Code for (installs to ~/.local/bin/claude)
claude_code_user: "{{ service_user }}"

# Release channel: "latest" (default) or "stable" (one week behind, fewer regressions)
claude_code_channel: stable

# Disable auto-updates (set to true to disable)
claude_code_disable_autoupdater: false

# Claude Code settings (~/.claude/settings.json)
claude_code_settings:
  autoUpdatesChannel: "stable"
  permissions:
    allow:
      - "mcp__context7__resolve-library-id"
      - "mcp__playwright"

# MCP servers to register via `claude mcp add`
# Each entry: { name, command, args (list), scope (default: user) }
claude_code_mcp_servers: []
