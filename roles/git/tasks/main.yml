---
- name: Install git and gh
  ansible.builtin.package:
    name:
      - git
      - gh
    state: present
  tags: git

- name: Configure git user name
  community.general.git_config:
    name: user.name
    value: "{{ git_user_name }}"
    scope: global
  become: true
  become_user: "{{ service_user }}"
  tags: git

- name: Configure git user email
  community.general.git_config:
    name: user.email
    value: "{{ git_user_email }}"
    scope: global
  become: true
  become_user: "{{ service_user }}"
  tags: git
